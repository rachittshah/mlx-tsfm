name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # macos-14/15 runners are Apple Silicon (arm64) — required for MLX.
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}
      - name: Install
        run: |
          uv venv --python ${{ matrix.python }}
          uv pip install -e '.[dev]'
      - name: Test (fast; real-weight + parity tests skip without cached weights / ref)
        run: uv run pytest -q
